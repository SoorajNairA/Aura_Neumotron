[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-agent"
version = "0.1.0"
description = "Local AI engineering workspace"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv==1.0.1",
    "requests==2.32.3",
]

[project.scripts]
aura = "aura.main:main"

[project.optional-dependencies]
voice = [
    "faster-whisper==1.1.1",
    "numpy==1.26.4",
    "sounddevice==0.5.1",
    "soundfile==0.13.1",
    "pyttsx3==2.98",
]
desktop = [
    "PySide6==6.8.3",
    "beautifulsoup4==4.12.3",
    "lxml==5.3.0",
]
xtts = [
    "spacy==3.7.5",
    "coqui-tts==0.25.3",
]
legacy-unreal = []
dev = [
    "pytest>=8,<9",
    "pytest-timeout>=2.3,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "unit: fast deterministic tests with no external services",
    "integration: local integration tests using controlled adapters",
    "live: opt-in tests that interact with real host services",
    "voice: tests for speech input or output",
    "desktop: tests for host desktop integration",
    "llm: tests requiring or simulating a language-model provider",
    "legacy: tests for archived or transitional functionality",
    "unreal: tests for the opt-in Unreal legacy subsystem",
    "slow: tests unsuitable for the default fast suite",
]
